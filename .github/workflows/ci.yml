name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: python scripts/validate_manifests.py
      - name: Reconcile approved config with rendered CCE manifests
        run: |
          huawei-release-audit \
            --config configs/prod.json \
            --deployment deploy/cce-deployment.yaml \
            --hpa deploy/cce-hpa.yaml \
            --allowed-registry swr.example.com/ml/ \
            --output /tmp/release-contract.json
          python -m json.tool /tmp/release-contract.json
      - run: huawei-ml-plan configs/prod.json > /tmp/prod-plan.json
      - run: python -m json.tool /tmp/prod-plan.json
      - run: huawei-ml-plan configs/dev.json > /tmp/dev-plan.json
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/dist
