apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-risk-inference
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraud-risk-inference
  template:
    metadata:
      labels:
        app: fraud-risk-inference
    spec:
      serviceAccountName: fraud-risk-inference
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: swr.example.com/ml/fraud-risk:0.1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
