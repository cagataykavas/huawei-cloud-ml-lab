apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-risk-inference
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fraud-risk-inference
  template:
    metadata:
      labels:
        app: fraud-risk-inference
    spec:
      serviceAccountName: fraud-risk-inference
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Fixture digest for this runnable lab; production pipelines must inject a verified SWR digest.
          image: swr.example.com/ml/fraud-risk@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          env:
            - name: MODEL_URI
              value: obs://ml-artifacts-prod/fraud-risk/model.onnx
            - name: MODEL_SHA256
              value: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            - name: KMS_KEY_ID
              value: kms-prod-ml-artifacts
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
